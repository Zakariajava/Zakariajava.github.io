<style>
  :root {
    /* Dark — primary */
    --bg-base: #07070A;
    --bg-surface: #0E0E12;
    --bg-surface-2: #16161B;
    --bg-glass: rgba(20, 20, 26, 0.55);

    --border-soft: rgba(255, 255, 255, 0.06);
    --border-default: rgba(255, 255, 255, 0.10);
    --border-strong: rgba(255, 255, 255, 0.18);

    --text-primary: #F5F5F7;
    --text-secondary: #A1A1AA;
    --text-tertiary: #6B6B73;

    --accent-primary: #7C5CFF;
    --accent-glow: rgba(124, 92, 255, 0.35);
    --accent-cyan: #5EE7DF;
    --accent-pink: #FF7AC6;
    --success: #34D399;
    --warning: #FBBF24;

    --ease-apple: cubic-bezier(0.32, 0.72, 0, 1);
    --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }

  html.light {
    --bg-base: #FAFAF7;
    --bg-surface: #FFFFFF;
    --bg-surface-2: #F2F1EB;
    --bg-glass: rgba(250, 250, 247, 0.72);
    --border-soft: rgba(0, 0, 0, 0.06);
    --border-default: rgba(0, 0, 0, 0.10);
    --border-strong: rgba(0, 0, 0, 0.18);
    --text-primary: #0A0A0A;
    --text-secondary: #525252;
    --text-tertiary: #A3A3A3;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; scroll-behavior: smooth; background: var(--bg-base); }
  html, body { overflow-x: clip; }
  body {
    background: var(--bg-base);
    color: var(--text-primary);
    font-family: var(--sans);
    font-weight: 400;
    font-size: 16px;
    line-height: 1.55;
    letter-spacing: -0.01em;
    min-height: 100vh;
  }
  a { color: inherit; text-decoration: none; }
  button { font-family: inherit; background: none; border: none; cursor: pointer; color: inherit; }
  ::selection { background: var(--accent-primary); color: #fff; }

  /* Subtle background gradients (Linear-ish) */
  .bg-fx {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(900px 600px at 80% -10%, rgba(124,92,255,0.10), transparent 60%),
      radial-gradient(700px 500px at -10% 30%, rgba(94,231,223,0.05), transparent 60%),
      radial-gradient(900px 700px at 50% 110%, rgba(124,92,255,0.06), transparent 60%);
  }
  html.light .bg-fx {
    background:
      radial-gradient(900px 600px at 80% -10%, rgba(124,92,255,0.06), transparent 60%),
      radial-gradient(700px 500px at -10% 30%, rgba(94,231,223,0.04), transparent 60%);
  }

  /* Focus ring */
  :focus-visible {
    outline: 2px solid var(--accent-primary);
    outline-offset: 3px;
    border-radius: 6px;
  }

  /* Reveal on scroll */
  .reveal { opacity: 0; transform: translateY(24px); transition: opacity 600ms var(--ease-apple), transform 600ms var(--ease-apple); }
  .reveal.is-in { opacity: 1; transform: translateY(0); }

  /* Pulse dot */
  @keyframes pulse-dot {
    0%   { box-shadow: 0 0 0 0 rgba(124,92,255,0.55); }
    70%  { box-shadow: 0 0 0 10px rgba(124,92,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(124,92,255,0); }
  }
  .pulse-dot {
    width: 6px; height: 6px; border-radius: 999px;
    background: var(--accent-primary);
    animation: pulse-dot 2s var(--ease-apple) infinite;
  }

  /* Fade-up stagger for hero name */
  @keyframes hero-rise {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .hero-rise-1 { animation: hero-rise 700ms var(--ease-apple) both; }
  .hero-rise-2 { animation: hero-rise 700ms 80ms var(--ease-apple) both; }
  .hero-rise-3 { animation: hero-rise 700ms 160ms var(--ease-apple) both; }
  .hero-rise-4 { animation: hero-rise 700ms 280ms var(--ease-apple) both; }
  .hero-rise-5 { animation: hero-rise 700ms 380ms var(--ease-apple) both; }

  /* Glass */
  .glass {
    background: var(--bg-glass);
    backdrop-filter: blur(12px) saturate(180%);
    -webkit-backdrop-filter: blur(12px) saturate(180%);
    border-bottom: 1px solid var(--border-soft);
    transition: backdrop-filter 300ms var(--ease-apple), background 300ms var(--ease-apple);
  }
  .glass.scrolled {
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
    background: rgba(10, 10, 14, 0.78);
  }
  html.light .glass.scrolled { background: rgba(250, 250, 247, 0.85); }

  /* Card */
  .card {
    background: linear-gradient(180deg, rgba(255,255,255,0.03) 0%, rgba(255,255,255,0) 100%);
    border: 1px solid var(--border-soft);
    border-radius: 20px;
    transition: all 350ms var(--ease-apple);
  }
  .card:hover {
    border-color: var(--border-default);
    background: linear-gradient(180deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0.01) 100%);
    transform: translateY(-4px);
    box-shadow: 0 0 80px -20px var(--accent-glow);
  }
  html.light .card {
    background: linear-gradient(180deg, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0) 100%);
  }
  html.light .card:hover {
    background: linear-gradient(180deg, rgba(0,0,0,0.04) 0%, rgba(0,0,0,0.01) 100%);
    box-shadow: 0 8px 40px -16px rgba(124,92,255,0.20);
  }

  /* Buttons (Apple-ish) */
  .btn-primary {
    background: var(--text-primary);
    color: var(--bg-base);
    padding: 12px 22px;
    border-radius: 999px;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: -0.01em;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all 300ms var(--ease-apple);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 10px 30px -10px rgba(245,245,247,0.25); }
  .btn-secondary {
    border: 1px solid var(--border-strong);
    color: var(--text-primary);
    padding: 12px 22px;
    border-radius: 999px;
    font-weight: 500;
    font-size: 15px;
    letter-spacing: -0.01em;
    display: inline-flex; align-items: center; gap: 8px;
    transition: all 300ms var(--ease-apple);
  }
  .btn-secondary:hover { background: var(--bg-surface-2); border-color: var(--text-secondary); }

  /* Mono labels */
  .mono { font-family: var(--mono); font-feature-settings: "ss01"; }
  .num-tag { font-family: var(--mono); color: var(--text-tertiary); font-size: 13px; letter-spacing: 0.02em; }

  /* Pill */
  .pill {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 6px 14px;
    border-radius: 999px;
    background: rgba(124,92,255,0.10);
    border: 1px solid rgba(124,92,255,0.25);
    color: var(--accent-primary);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: -0.005em;
  }

  /* Tech tag */
  .tech {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 6px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border-soft);
    color: var(--text-secondary);
    transition: all 250ms var(--ease-apple);
    white-space: nowrap;
  }
  .tech:hover { color: var(--text-primary); border-color: rgba(124,92,255,0.40); background: rgba(124,92,255,0.08); }
  html.light .tech { background: rgba(0,0,0,0.03); }

  /* Hide scrollbars in icon row */
  .no-scrollbar::-webkit-scrollbar { display: none; }
  .no-scrollbar { scrollbar-width: none; }

  /* Sections */
  section.section { position: relative; padding: 96px 0; border-top: 1px solid var(--border-soft); }
  @media (max-width: 768px) { section.section { padding: 64px 0; } }

  /* Display sizes */
  .display-1 { font-size: clamp(48px, 9vw, 88px); line-height: 0.98; letter-spacing: -0.04em; font-weight: 600; }
  .display-2 { font-size: clamp(36px, 5vw, 60px); line-height: 1.05; letter-spacing: -0.03em; font-weight: 600; }
  .display-3 { font-size: clamp(24px, 3vw, 36px); line-height: 1.1; letter-spacing: -0.02em; font-weight: 600; }

  /* Hero gradient name */
  .name-gradient {
    background: linear-gradient(180deg, #FFFFFF 0%, #C9C9D1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  html.light .name-gradient { background: linear-gradient(180deg, #0A0A0A 0%, #525252 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .reveal { opacity: 1 !important; transform: none !important; }
    html { scroll-behavior: auto; }
  }

  /* Avatar gradient */
  .avatar-grad {
    background: conic-gradient(from 220deg at 50% 50%, #7C5CFF 0%, #5EE7DF 35%, #FF7AC6 70%, #7C5CFF 100%);
  }

  /* Mobile menu */
  .mobile-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(7, 7, 10, 0.92);
    backdrop-filter: blur(28px) saturate(180%);
    -webkit-backdrop-filter: blur(28px) saturate(180%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 24px;
    opacity: 0; pointer-events: none;
    transition: opacity 350ms var(--ease-apple);
  }
  .mobile-overlay.open { opacity: 1; pointer-events: auto; }
  html.light .mobile-overlay { background: rgba(250, 250, 247, 0.92); }

  /* ─── Responsive layout (phones / small tablets) ─── */
  /* Inline grids in the JSX can't carry media queries, so these classes
     override grid-template-columns below 768px. Desktop is untouched. */
  @media (max-width: 768px) {
    /* Narrower side gutters so content keeps more width on phones */
    section.section > div,
    footer > div { padding-left: 20px !important; padding-right: 20px !important; }

    /* Collapse every two-/three-column grid into a single column */
    .sec-header-grid,
    .r-cols-2,
    .r-langs { grid-template-columns: 1fr !important; }
    .sec-header-grid { gap: 12px !important; margin-bottom: 36px !important; }
    .r-cols-2 { gap: 20px !important; }
    .r-langs { gap: 10px !important; }
    .r-langs-level { text-align: left !important; }

    /* Card grids: single column, never wider than the viewport */
    .r-grid-cards { grid-template-columns: 1fr !important; }
  }
</style>
